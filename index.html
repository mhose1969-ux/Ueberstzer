<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mikes Übersetzer (Prototyp V1)</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; background: #f4f4f9; }
    h1 { color: #333; }
    .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; color: white; }
    #startBtn { background-color: #28a745; }
    #stopBtn { background-color: #dc3545; }
    #downloadBtn { background-color: #007bff; }
    #status { font-weight: bold; padding: 10px; background: #fff; border-radius: 5px; border: 1px solid #ccc; flex-grow: 1; }
    #transcript { background: #fff; padding: 15px; border-radius: 5px; border: 1px solid #ccc; height: 400px; overflow-y: auto; }
    .entry { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    .lang-tag { font-weight: bold; color: #555; }
    .original { font-style: italic; color: #333; }
    .translation { font-weight: bold; color: #0056b3; }
  </style>
</head>
<body>

  <h1>Mikes Übersetzer (V1 Browser-Prototyp)</h1>
  
  <div class="controls">
    <button id="startBtn" onclick="startListening()">Starten</button>
    <button id="stopBtn" onclick="stopListening()">Stoppen</button>
    <button id="downloadBtn" onclick="downloadTranscript()">Transkript Herunterladen</button>
  </div>

  <div id="status">Status: Bereit</div>

  <h3>Transkript</h3>
  <div id="transcript"></div>

  <script>
    let recognition;
    let pauseTimer = null;
    let accumulatedText = "";
    let isListening = false;
    let transcriptData = [];

    // Prüfen, ob der Browser Web Speech API unterstützt
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Dein Browser unterstützt die Web Speech API leider nicht. Bitte benutze Google Chrome oder MS Edge.");
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'de-DE'; // Startsprache (Erkennt DE/ES dynamisch)

      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            accumulatedText += event.results[i][0].transcript + ' ';
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        const currentSpeech = accumulatedText + interimTranscript;
        if (currentSpeech.trim().length > 0) {
          document.getElementById('status').innerText = "Sprecher erkannt... (Warte auf 5 Sek. Pause)";
          
          // Timer zurücksetzen, wenn weiter gesprochen wird
          clearTimeout(pauseTimer);
          pauseTimer = setTimeout(() => {
            processTranslation(accumulatedText.trim());
            accumulatedText = "";
          }, 5000); // 5000ms = 5 Sekunden Pause
        }
      };

      recognition.onerror = (event) => {
        console.error("Spracherkennungsfehler:", event.error);
        document.getElementById('status').innerText = "Fehler: " + event.error;
      };

      recognition.onend = () => {
        if (isListening) {
          recognition.start(); // Neustart bei Verbindungsabriss
        }
      };
    }

    function startListening() {
      if (recognition && !isListening) {
        isListening = true;
        accumulatedText = "";
        recognition.start();
        document.getElementById('status').innerText = "Zuhören aktiv... Spreche auf Deutsch oder Spanisch.";
      }
    }

    function stopListening() {
      if (recognition && isListening) {
        isListening = false;
        clearTimeout(pauseTimer);
        recognition.stop();
        document.getElementById('status').innerText = "Gestoppt.";
      }
    }

    // Einfache automatische Spracherkennung & Übersetzung
    async function processTranslation(text) {
      if (!text) return;

      document.getElementById('status').innerText = "Übersetze...";

      // Grobe Sprachprüfung (Spanische Typika oder DE)
      const isSpanish = /[áéíóúñ¿¡]/i.test(text) || /\b(el|la|los|las|un|una|por|para|que|con|es|son)\b/i.test(text);
      const sourceLang = isSpanish ? 'es' : 'de';
      const targetLang = isSpanish ? 'de' : 'es';

      try {
        // Freie Google Translate API für Prototyp
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        const translatedText = data[0].map(item => item[0]).join('');

        // Speichern im Transkript
        addTranscriptEntry(sourceLang.toUpperCase(), targetLang.toUpperCase(), text, translatedText);

        // Sprachausgabe
        speakText(translatedText, targetLang);

        document.getElementById('status').innerText = "Zuhören aktiv... Spreche auf Deutsch oder Spanisch.";
      } catch (err) {
        console.error("Übersetzungsfehler:", err);
        document.getElementById('status').innerText = "Fehler bei der Übersetzung.";
      }
    }

    function addTranscriptEntry(source, target, original, translation) {
      const entryHtml = `
        <div class="entry">
          <div class="lang-tag">[${source} ➔ ${target}]</div>
          <div class="original">Original: ${original}</div>
          <div class="translation">Übersetzung: ${translation}</div>
        </div>
      `;
      document.getElementById('transcript').innerHTML += entryHtml;
      document.getElementById('transcript').scrollTop = document.getElementById('transcript').scrollHeight;

      transcriptData.push(`[${source} -> ${target}]\nOriginal: ${original}\nÜbersetzung: ${translation}\n---`);
    }

    function speakText(text, lang) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'es' ? 'es-ES' : 'de-DE';
      window.speechSynthesis.speak(utterance);
    }

    function downloadTranscript() {
      if (transcriptData.length === 0) {
        alert("Das Transkript ist noch leer.");
        return;
      }
      const blob = new Blob([transcriptData.join('\n\n')], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Transkript_${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
    }
  </script>
</body>
</html>
