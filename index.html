<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Übersetzer</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; max-width: 600px; margin: auto; background-color: #f4f6f8; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        
        /* Flaggen-Buttons */
        .flag-container { display: flex; gap: 15px; margin-bottom: 20px; }
        .flag-card { 
            flex: 1; 
            background: white; 
            border: 2px solid #e0e0e0; 
            border-radius: 16px; 
            padding: 20px 10px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .flag-card:active { transform: scale(0.96); }
        .flag-card.active-es { border-color: #e67e22; background-color: #fef5ec; box-shadow: 0 0 12px rgba(230, 126, 34, 0.3); }
        .flag-card.active-de { border-color: #27ae60; background-color: #f0f9f4; box-shadow: 0 0 12px rgba(39, 174, 96, 0.3); }
        
        .flag-icon { font-size: 48px; display: block; margin-bottom: 8px; line-height: 1; }
        .flag-label { font-weight: bold; font-size: 18px; color: #2c3e50; }
        .flag-sub { font-size: 13px; color: #7f8c8d; margin-top: 4px; }

        .btn-stop { 
            background-color: #e74c3c; 
            color: white; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: bold; 
            width: 100%; 
            border-radius: 10px; 
            border: none; 
            cursor: pointer; 
            margin-bottom: 20px; 
            display: none; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Textausgabe */
        .box { background: white; padding: 15px; border-radius: 10px; min-height: 70px; margin-bottom: 15px; border: 1px solid #e0e0e0; font-size: 16px; line-height: 1.4; }
        .translation { background: #e8f5e9; border-color: #c8e6c9; font-weight: bold; color: #1b5e20; }
        #status { font-weight: bold; color: #2980b9; margin-bottom: 15px; text-align: center; min-height: 22px; font-size: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #34495e; }
    </style>
</head>
<body>

    <h2>Live Übersetzer</h2>
    <div class="subtitle">Tippe auf die Sprache, die gesprochen wird</div>

    <div id="status">Bereit...</div>

    <!-- Flaggen Auswahlschaltflächen -->
    <div class="flag-container" id="flagButtons">
        <div class="flag-card" id="btnEs">
            <span class="flag-icon">🇪🇸</span>
            <div class="flag-label">Spanisch</div>
            <div class="flag-sub">➔ Deutsch</div>
        </div>
        <div class="flag-card" id="btnDe">
            <span class="flag-icon">🇩🇪</span>
            <div class="flag-label">Deutsch</div>
            <div class="flag-sub">➔ Spanisch</div>
        </div>
    </div>

    <button id="btnStop" class="btn-stop">⏹️ Zuhören beenden</button>

    <div>
        <label>Erkannter Text:</label>
        <div id="originalText" class="box"></div>
    </div>

    <div>
        <label>Übersetzung:</label>
        <div id="translatedText" class="box translation"></div>
    </div>

    <script>
        const btnEs = document.getElementById('btnEs');
        const btnDe = document.getElementById('btnDe');
        const btnStop = document.getElementById('btnStop');
        const statusDiv = document.getElementById('status');
        const originalDiv = document.getElementById('originalText');
        const translatedDiv = document.getElementById('translatedText');

        let recognition;
        let isListening = false;
        let silenceTimer = null;
        let lastText = "";
        let currentSourceLang = "es";

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("Bitte nutze Chrome oder Safari auf deinem Smartphone.");
        } else {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let interimText = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    interimText += event.results[i][0].transcript;
                }
                
                originalDiv.innerText = interimText;
                lastText = interimText;

                resetSilenceTimer();
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech' && isListening) {
                    console.error("Fehler:", event.error);
                }
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        }

        btnEs.addEventListener('click', () => startListening('es'));
        btnDe.addEventListener('click', () => startListening('de'));
        btnStop.addEventListener('click', stopListening);

        function startListening(lang) {
            currentSourceLang = lang;
            recognition.lang = lang === 'es' ? 'es-ES' : 'de-DE';
            
            isListening = true;
            btnStop.style.display = "block";
            
            btnEs.classList.remove('active-es');
            btnDe.classList.remove('active-de');

            if (lang === 'es') {
                btnEs.classList.add('active-es');
                statusDiv.innerText = "🔴 Höre auf Spanisch zu... (5s Stille-Timer aktiv)";
            } else {
                btnDe.classList.add('active-de');
                statusDiv.innerText = "🔴 Höre auf Deutsch zu... (5s Stille-Timer aktiv)";
            }

            originalDiv.innerText = "";
            translatedDiv.innerText = "";
            lastText = "";
            
            try { recognition.start(); } catch(e) {}
        }

        function stopListening() {
            isListening = false;
            clearTimeout(silenceTimer);
            btnStop.style.display = "none";
            btnEs.classList.remove('active-es');
            btnDe.classList.remove('active-de');
            statusDiv.innerText = "Bereit...";
            recognition.stop();
        }

        function resetSilenceTimer() {
            statusDiv.innerText = "Sprechen erkannt... (Warte auf 5s Stille)";
            clearTimeout(silenceTimer);
            
            silenceTimer = setTimeout(() => {
                if (lastText.trim() !== "") {
                    translateAndSpeak(lastText);
                }
            }, 5000);
        }

        async function translateAndSpeak(text) {
            statusDiv.innerText = "Übersetze...";
            
            const sourceLang = currentSourceLang;
            const targetLang = currentSourceLang === 'es' ? 'de' : 'es';

            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|${targetLang}`);
                const data = await response.json();
                
                const translation = data.responseData.translatedText;
                translatedDiv.innerText = translation;
                statusDiv.innerText = "Lese vor...";

                const utterance = new SpeechSynthesisUtterance(translation);
                utterance.lang = targetLang === 'de' ? 'de-DE' : 'es-ES';
                
                window.speechSynthesis.speak(utterance);

                utterance.onend = () => {
                    const langName = currentSourceLang === 'es' ? 'Spanisch 🇪🇸' : 'Deutsch 🇩🇪';
                    statusDiv.innerText = `Fertig. Höre weiter zu auf ${langName}...`;
                    lastText = "";
                };

            } catch (error) {
                statusDiv.innerText = "Fehler bei der Übersetzung.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
